name: Storefront smoke

on:
  repository_dispatch:
    types: [storefront-deployed]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployed storefront to verify.
        required: true
        default: production
        type: choice
        options: [production, dev-1, dev-2, dev-3, dev-4, dev-5, dev-6]
  push:
    branches:
      - production
      - 'dev-[1-6]'

permissions:
  contents: read

concurrency:
  group: buyer-smoke-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event_name == 'repository_dispatch' && github.event.client_payload.environment || github.ref_name }}
  cancel-in-progress: true

env:
  ALLURE_RESULTS_DIR: allure-results
  # WAF exemption for the CI egress IP, issued by the site owner. Without it the storefront answers
  # bare 403s under full-suite load -- on documents and on their subresources. Absent or empty is
  # supported: tests/fixtures/internal-origin.ts becomes a no-op and the retry ladder in
  # navigation.ts carries the run instead.
  #
  # Both tiers are passed unconditionally rather than picked with a ternary here: env.ts chooses by
  # target environment, so a run can never be handed the key for a host it is not pointed at.
  INTERNAL_ORIGIN_KEY: ${{ secrets.INTERNAL_ORIGIN_KEY }}
  DEV_INTERNAL_ORIGIN_KEY: ${{ secrets.DEV_INTERNAL_ORIGIN_KEY }}
  # Branch names match the keys in tests/fixtures/environments.ts exactly, so this alone
  # selects the right storefront/API URLs for whichever branch triggered the push.
  E2E_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event_name == 'repository_dispatch' && github.event.client_payload.environment || github.ref_name }}
  E2E_BROWSER_PROJECT: chromium-desktop
  RUN_PAYMENT_E2E: 'false'
  RUN_AUTH_DESTRUCTIVE_E2E: 'false'

jobs:
  smoke:
    name: Storefront smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      allure_results_found: ${{ steps.test_artifacts.outputs.allure_results_found }}
      environment: ${{ steps.target.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js, dependencies and Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browser_project: chromium-desktop

      - name: Validate deployment target
        id: target
        shell: bash
        run: |
          case "$E2E_ENVIRONMENT" in
            production|dev-[1-6]) ;;
            *) echo "Unsupported deployment environment" >&2; exit 1 ;;
          esac
          echo "environment=$E2E_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Run browser-free API contracts
        run: npm run test:api

      - name: Run critical UI smoke
        run: npm run test:ui:smoke

      - name: Collect Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: storefront-smoke-playwright-results
          retention_days: 7

  allure-report:
    name: Publish Allure report with history
    needs: smoke
    if: ${{ always() && github.ref == 'refs/heads/production' && needs.smoke.outputs.environment == 'production' && needs.smoke.outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          allure_service_access_token: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
          artifact_name: storefront-smoke-playwright-results
          report_name: Storefront smoke
          report_slug: storefront-smoke
