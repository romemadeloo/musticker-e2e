name: Visual regression

# `@visual` coverage existed but could never run: RUN_VISUAL_E2E appeared in no workflow, and the six
# committed baselines are `*-chromium-desktop-win32.png`, generated on a maintainer's Windows machine.
# Playwright names snapshots per platform, so an Ubuntu runner would not find them -- it would report
# every page as a missing snapshot, write the Linux PNGs it just captured, and fail.
#
# This workflow fixes the platform half of that. It runs inside the pinned Playwright container so
# rendering is reproducible run to run (a bare ubuntu-latest runner's font set drifts and would flap),
# and it has an explicit mode for generating baselines:
#
#   1. Dispatch it with update_baselines = true. It captures Linux baselines and uploads them.
#   2. Download the artifact, commit the `*-linux.png` files next to the existing win32 ones.
#   3. From then on, scheduled runs compare against them and fail on a real visual change.
#
# Until step 2 has happened the scheduled run fails with "snapshot doesn't exist" -- which is honest.
# The alternative, silently accepting whatever the run captured, would report visual coverage that
# cannot detect anything.

on:
  schedule:
    # 05:00 Asia/Manila every day, after the production full suite.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Storefront environment to snapshot.
        required: true
        default: production
        type: choice
        options:
          - production
          - static-1
          - static-2
          - static-3
          - static-4
          - static-5
          - static-6
          - static-7
          - static-8
      update_baselines:
        description: >-
          Capture new baselines instead of comparing against the committed ones, and upload them for
          review. Never commits anything itself.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: false

env:
  ALLURE_RESULTS_DIR: allure-results
  # WAF exemption for the CI egress IP, issued by the site owner. Without it the storefront answers
  # bare 403s under full-suite load -- on documents and on their subresources. Absent or empty is
  # supported: tests/fixtures/internal-origin.ts becomes a no-op and the retry ladder in
  # navigation.ts carries the run instead.
  #
  # Both tiers are passed unconditionally rather than picked with a ternary here: env.ts chooses by
  # target environment, so a run can never be handed the key for a host it is not pointed at.
  INTERNAL_ORIGIN_KEY: ${{ secrets.INTERNAL_ORIGIN_KEY }}
  DEV_INTERNAL_ORIGIN_KEY: ${{ secrets.DEV_INTERNAL_ORIGIN_KEY }}
  E2E_BROWSER_PROJECT: chromium-desktop
  E2E_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  RUN_PAYMENT_E2E: 'false'
  RUN_VISUAL_E2E: 'true'

jobs:
  visual:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines && 'Capture baselines' || 'Compare snapshots' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Not a real matrix -- a single value, declared here because `container.image` cannot read the
    # `env` context but can read `matrix`. It gives the image tag and the drift check below one
    # source of truth, so the two cannot be bumped apart.
    strategy:
      matrix:
        playwright-version: ['1.59.1']

    # Pinned to the installed @playwright/test version. Bump both together: a container newer than
    # the library (or vice versa) shifts font rendering and quietly invalidates every baseline. The
    # "Verify container matches Playwright" step below fails the run if they ever drift apart. `npm
    # ci` installs the lockfile exactly, so the realistic drift is a lockfile bump -- Dependabot,
    # say -- that leaves this tag behind.
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright-version }}-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js, dependencies and Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browser_project: none

      - name: Verify container matches Playwright
        shell: bash
        # The tag this job actually pulled. Read from the matrix rather than from a
        # PLAYWRIGHT_VERSION env var: the Playwright images do not set one, so the previous check
        # took its "cannot determine the version" escape hatch on every run and compared nothing.
        env:
          CONTAINER_PLAYWRIGHT_VERSION: ${{ matrix.playwright-version }}
        run: |
          set -euo pipefail

          installed="$(node -e "console.log(require('@playwright/test/package.json').version)")"
          container="$CONTAINER_PLAYWRIGHT_VERSION"

          echo "Installed @playwright/test: $installed"
          echo "Container image version:    $container"

          if [ "$installed" != "$container" ]; then
            echo "The Playwright container ($container) does not match the installed library ($installed)." >&2
            echo "Baselines captured under one will not match the other. Update the container image tag" >&2
            echo "in .github/workflows/visual-regression.yml to v$installed-noble and recapture." >&2
            exit 1
          fi

      - name: Compare visual snapshots
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
        run: npm run test:visual

      - name: Capture new baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        run: npm run test:visual:update

      - name: Upload captured baselines
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: visual-baselines-linux
          path: tests/e2e/**/*-snapshots/**
          retention-days: 30

      - name: Upload Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: visual-regression-playwright-results
          retention_days: 14

      - name: Explain a missing-baseline failure
        if: ${{ failure() && !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
        shell: bash
        run: |
          {
            echo "### Visual regression failed"
            echo ""
            echo "If the failures read \`snapshot doesn't exist\`, Linux baselines have not been"
            echo "committed yet. Dispatch this workflow with **update_baselines = true**, download the"
            echo "\`visual-baselines-linux\` artifact, and commit the \`*-linux.png\` files under"
            echo "\`tests/e2e/storefront/regression/visual.spec.ts-snapshots/\`."
            echo ""
            echo "Otherwise the storefront's appearance changed. Review the diff images in the"
            echo "Playwright report before updating any baseline."
          } >> "$GITHUB_STEP_SUMMARY"
