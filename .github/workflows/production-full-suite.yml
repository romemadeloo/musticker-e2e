name: Production full suite

on:
  push:
    branches:
      - production
  schedule:
    # 04:00 Asia/Manila every day.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Production suite to run.
        required: true
        default: production-safe-full
        type: choice
        options:
          - production-safe-full
          - smoke
          - auth
      browser_project:
        description: Browser project to run.
        required: true
        default: chromium-desktop
        type: choice
        options:
          - chromium-desktop
          - firefox-desktop
          - webkit-desktop
          - chromium-mobile
          - all-desktop
      shards:
        description: How many parallel shards to split the suite across.
        required: true
        default: '8'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '6'
          - '8'

permissions:
  contents: read

concurrency:
  group: production-full-suite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://www.musticker.com/kr' }}
  E2E_BROWSER_PROJECT: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_project || 'chromium-desktop' }}
  RUN_PAYMENT_E2E: 'false'
  AUTH_TEST_EMAIL: ${{ secrets.AUTH_TEST_EMAIL }}
  AUTH_TEST_PASSWORD: ${{ secrets.AUTH_TEST_PASSWORD }}
  # WAF exemption for the CI egress IP, issued by the site owner. Without it the storefront answers
  # bare 403s under full-suite load -- on documents and on their subresources. Absent or empty is
  # supported: tests/fixtures/internal-origin.ts becomes a no-op and the retry ladder in
  # navigation.ts carries the run instead.
  #
  # Both tiers are passed unconditionally rather than picked with a ternary here: env.ts chooses by
  # target environment, so a run can never be handed the key for a host it is not pointed at.
  INTERNAL_ORIGIN_KEY: ${{ secrets.INTERNAL_ORIGIN_KEY }}
  DEV_INTERNAL_ORIGIN_KEY: ${{ secrets.DEV_INTERNAL_ORIGIN_KEY }}
  # One browser per runner, against eight shards rather than the previous four. The WAF counts
  # requests per egress IP and a runner has exactly one, so two workers on four runners is twice the
  # per-IP rate of one worker on eight -- for the same eight browsers and the same wall clock. Run
  # 121 lost four tests to two ~100s IP bans, both of them on a single runner while the other three
  # shards went untouched, which is the shape this splits up.
  PW_WORKERS: '1'
  PW_BLOB_REPORT: 'true'

jobs:
  static-quality:
    name: Lint, type check, and discover tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js, dependencies and Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browser_project: none

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: List Playwright tests
        run: npm run test:e2e:list

  plan:
    name: Plan shards
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
      suite: ${{ steps.plan.outputs.suite }}

    steps:
      - name: Resolve shard count and suite
        id: plan
        shell: bash
        env:
          REQUESTED_SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || '8' }}
          REQUESTED_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'production-safe-full' }}
        run: |
          set -euo pipefail

          total="$REQUESTED_SHARDS"

          if ! [[ "$total" =~ ^[1-9][0-9]?$ ]]; then
            echo "Invalid shard count: $total" >&2
            exit 1
          fi

          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 1 "$total")]" >> "$GITHUB_OUTPUT"
          echo "suite=$REQUESTED_SUITE" >> "$GITHUB_OUTPUT"

  production-tests:
    name: ${{ needs.plan.outputs.suite }} shard ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js, dependencies and Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browser_project: ${{ env.E2E_BROWSER_PROJECT }}

      - name: Run production suite shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
          SUITE: ${{ needs.plan.outputs.suite }}
        run: |
          set -euo pipefail

          case "$SUITE" in
            smoke)
              npm run test:prod:smoke -- --shard="$SHARD"
              ;;
            auth)
              npm run test:prod:auth -- --shard="$SHARD"
              ;;
            production-safe-full)
              npm run test:prod:full -- --shard="$SHARD"
              ;;
            *)
              echo "Unsupported production suite: $SUITE" >&2
              exit 1
              ;;
          esac

      - name: Upload shard results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: production-suite-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            blob-report/
            allure-results/
            test-results/
          retention-days: 14

  merge-reports:
    name: Merge shard reports
    needs: [plan, production-tests]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      allure_results_found: ${{ steps.merge.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Merge shard reports
        id: merge
        uses: ./.github/actions/merge-shard-reports
        with:
          artifact_name: production-${{ needs.plan.outputs.suite }}-${{ github.run_attempt }}
          retention_days: 14
          shard_artifact_pattern: production-suite-shard-*-${{ github.run_attempt }}

  allure-report:
    name: Publish Allure report with history
    needs: [plan, merge-reports]
    if: ${{ always() && github.ref == 'refs/heads/production' && needs.merge-reports.outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          allure_service_access_token: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
          artifact_name: production-${{ needs.plan.outputs.suite }}-${{ github.run_attempt }}
          report_name: Production ${{ needs.plan.outputs.suite }} on ${{ github.event_name == 'workflow_dispatch' && inputs.browser_project || 'chromium-desktop' }}
          # Keeps the browser in the slug: a firefox-desktop dispatch must not overwrite the
          # chromium-desktop report already published on Pages.
          report_slug: production-${{ needs.plan.outputs.suite }}-${{ github.event_name == 'workflow_dispatch' && inputs.browser_project || 'chromium-desktop' }}
