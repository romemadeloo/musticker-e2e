name: PR checks

on:
  pull_request:
    branches:
      - production
      - 'dev-[1-6]'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ALLURE_RESULTS_DIR: allure-results
  # The branch the PR merges into names its server (tests/fixtures/environments.ts), the same way
  # smoke.yml uses the pushed branch. This used to pin BASE_URL to production, so a PR into a dev
  # branch was smoke-tested against a server it would never be deployed to.
  E2E_ENVIRONMENT: ${{ github.base_ref }}
  # WAF exemption for the CI egress IP, issued by the site owner. Without it the storefront answers
  # bare 403s under full-suite load -- on documents and on their subresources. Absent or empty is
  # supported: tests/fixtures/internal-origin.ts becomes a no-op and the retry ladder in
  # navigation.ts carries the run instead.
  #
  # Both tiers are passed unconditionally rather than picked with a ternary here: env.ts chooses by
  # target environment, so a run can never be handed the key for a host it is not pointed at.
  INTERNAL_ORIGIN_KEY: ${{ secrets.INTERNAL_ORIGIN_KEY }}
  DEV_INTERNAL_ORIGIN_KEY: ${{ secrets.DEV_INTERNAL_ORIGIN_KEY }}
  E2E_BROWSER_PROJECT: chromium-desktop
  RUN_PAYMENT_E2E: 'false'
  RUN_AUTH_DESTRUCTIVE_E2E: 'false'
  AUTH_TEST_EMAIL: >-
    ${{ github.base_ref == 'production' && secrets.AUTH_TEST_EMAIL || secrets.DEV_AUTH_TEST_EMAIL }}
  AUTH_TEST_PASSWORD: >-
    ${{ github.base_ref == 'production' && secrets.AUTH_TEST_PASSWORD || secrets.DEV_AUTH_TEST_PASSWORD }}

jobs:
  lint-typecheck-smoke:
    name: Lint, type check, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      allure_results_found: ${{ steps.test_artifacts.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js, dependencies and Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browser_project: chromium-desktop

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run isolated framework checks
        run: npm run test:framework

      - name: Run smoke tests
        run: npm run test:ui:smoke

      - name: Collect Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: pr-checks-playwright-results
          retention_days: 7

  api-contracts:
    name: API contracts (no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-playwright
        with:
          browser_project: none
      - run: npm run test:api
      - name: Retain API evidence
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: pr-api-results
          retention_days: 7

  promotion-validation:
    name: Reviewed promotion and affected regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-playwright
        with:
          browser_project: chromium-desktop
      - name: Validate promotion bundles and affected regression on dev
        env:
          AUTH_TEST_EMAIL: ${{ secrets.DEV_AUTH_TEST_EMAIL }}
          AUTH_TEST_PASSWORD: ${{ secrets.DEV_AUTH_TEST_PASSWORD }}
          INTERNAL_ORIGIN_KEY: ''
          TEST_DATA_USER_DELETE_ENDPOINT: ${{ vars.PROMOTION_USER_DELETE_ENDPOINT }}
        run: npm run promotion:ci -- ${{ github.event.pull_request.base.sha }}

      - name: Retain promotion validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: promotion-validation
          path: promotions/*/evidence/
          if-no-files-found: ignore
          retention-days: 7


  pr-gate:
    name: PR gate
    needs: [lint-typecheck-smoke, api-contracts, promotion-validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        shell: bash
        env:
          UI_RESULT: ${{ needs.lint-typecheck-smoke.result }}
          API_RESULT: ${{ needs.api-contracts.result }}
          PROMOTION_RESULT: ${{ needs.promotion-validation.result }}
        run: |
          test "$UI_RESULT" = success
          test "$API_RESULT" = success
          test "$PROMOTION_RESULT" = success

  allure-report:
    name: Publish Allure report with history
    needs: lint-typecheck-smoke
    if: ${{ always() && github.base_ref == 'production' && needs['lint-typecheck-smoke'].outputs.allure_results_found == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          allure_service_access_token: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
          artifact_name: pr-checks-playwright-results
          report_name: PR checks
          report_slug: pr-checks
